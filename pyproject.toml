[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cca-compensability-experiments"
version = "5.0.0"
description = "Prospective validation of payable relief and compensation timing for supplier selection"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Peplluis Esteva" },
  { name = "Amogh Desmukh" }
]
keywords = [
  "supplier selection",
  "supply chain finance",
  "invoice networks",
  "compensability",
  "compensation timing",
  "relief-days",
  "temporal validation",
  "working capital"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = [
  "matplotlib>=3.8,<4",
  "networkx>=3.2,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "python-dateutil>=2.8,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "openpyxl>=3.1,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.urls]
Repository = "https://github.com/OWNER/cca-compensability-experiments"
Issues = "https://github.com/OWNER/cca-compensability-experiments/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["paper"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
